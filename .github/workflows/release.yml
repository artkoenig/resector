name: Release

# Tag push (v<package.json version>) → binaries for all NFR-5 targets, smoke-tested on
# native runners, uploaded to GitHub Releases.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      # Full gate before release (architecture §7); no Stryker cache here, so mutation runs in full.
      - run: bun run gate
      # Cross-compiling needs every platform's OpenTUI native package in node_modules.
      - run: bun install --frozen-lockfile --os='*' --cpu='*'
      - run: bun scripts/build.ts --tag "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, os: macos-latest }
          - { target: darwin-x64, os: macos-15-intel }
          - { target: linux-x64, os: ubuntu-latest }
          - { target: linux-arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile # bunfig.toml preloads @opentui/solid
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      # --version, then the Gate rendered in a PTY against the fake backend (loads the OpenTUI native lib).
      - run: |
          tar -xzf "release/resector-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz" -C release
          bun scripts/smoke.ts release/resector "${GITHUB_REF_NAME#v}"

  release:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
      - run: gh release create "$GITHUB_REF_NAME" *.tar.gz SHA256SUMS --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
